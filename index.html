const Site={limit:10,types:['Landing page','Portfólio','Loja','Negócio local','Blog'],styles:{escuro:'Escuro elegante',claro:'Claro minimalista',vivo:'Colorido'},

ctas:{'Landing page':'Quero saber mais','Portfólio':'Fale comigo','Loja':'Ver produtos','Negócio local':'Entrar em contato','Blog':'Ler artigos'},
today(){return App.ld()},used(){return S.gen.d===this.today()?S.gen.n:0},left(){return Math.max(0,this.limit-this.used())},count(){S.gen={d:this.today(),n:this.used()+1};App.save()},refund(){S.gen={d:this.today(),n:Math.max(0,this.used()-1)};App.save()},
template(f){const t=this.themes[f.style]||this.themes.escuro,n=esc(f.name),d=esc(f.desc),cta=this.ctas[f.type]||'Saiba mais',ft=this.feats[f.type]||this.feats['Landing page'];

async ai(f){const sample=window.claude?await window.claude.use('sample'):null;if(!sample)return null;const q='Crie um site completo de UMA página, em um único arquivo HTML com CSS e JavaScript embutidos, em português do Brasil. Tipo: '+f.type+'. Nome: '+f.name+'. Descrição: '+f.desc+'. Estilo: '+f.styleLabel+'. Regras: se o pedido envolver conteúdo sexual, +18, violência extrema ou ilegal, responda somente RECUSADO; responsivo para celular, visual moderno e profissional, sem imagens, fontes ou bibliotecas externas, com seções claras (início, benefícios, sobre, contato) e textos reais. Responda SOMENTE com o código HTML, começando em <!DOCTYPE html>.';const r=await sample([{role:'user',content:q}],{cache:false});if(/^\s*RECUSADO/.test(String(r.text))||!Safe.ok(String(r.text)))throw new Error('recusado');const h=String(r.text).replace(/^\s*```(?:html)?\s*/i,'').replace(/```\s*$/,'').trim();return /<html[\s>]/i.test(h)&&h.length<200000?h:null},

labels:{moto:'corrida em primeira pessoa',quiz:'jogo de perguntas',loja:'loja online',tarefas:'app de tarefas',runner:'jogo de corrida infinita'},
prompt(kind,type,txt){const k=this.pick(txt,type);
return 'Você é o ORVEXA Project, um time sênior de design de jogos e produtos digitais que transforma ideias em projetos reais para jovens iniciantes brasileiros. '+(kind==='builder'?'Tipo de projeto: '+type+'. ':'')+'Ideia da pessoa: "'+txt+'".\n\nREGRAS: use TODOS os detalhes citados, sem generalizar e sem inventar o que não foi pedido. PENSE ANTES: primeiro, entre as linhas <<<PLAN e PLAN>>>, planeje em até 12 linhas o visual, as mecânicas ou telas, a estrutura do código e como atingir qualidade comercial. Depois responda em português do Brasil, EXATAMENTE neste formato, com estes títulos (cada seção com no máximo 5 itens curtos):\n'+this.sec[kind].map(x=>'### '+x).join('\n')+'\n\nPor fim, entre as linhas <<<HTML e HTML>>>, entregue o protótipo completo em UM arquivo HTML (CSS e JavaScript embutidos, sem imagens, fontes ou bibliotecas externas, responsivo, controles de toque e teclado).\nPADRÃO DE QUALIDADE: aparência de produto comercial de hoje, nunca de protótipo primitivo: gráficos ricos (degradês, sombras, partículas, parallax, animações suaves), física e dinâmica convincentes, sons com WebAudio, HUD completo, menus, telas de vitória e derrota, feedback visual em cada ação, dados de exemplo realistas. PROIBIDO: retângulos simples, telas vazias, mecânica rasa. Tamanho: até 700 linhas se necessário.'+(k?'\nBASE DE QUALIDADE ('+this.labels[k]+'): use como ponto de partida, mantenha este nível de acabamento e adapte TUDO ao pedido (nomes, tema, regras, telas, personagens).'+(['moto','runner','quiz'].includes(k)?' Se for jogo, entregue um jogo jogável de verdade com menu, escolha de personagem ou veículo, fases ou desafios, pontuação ou tempo e recordes.':'')+'\n<<<BASE\n'+this.bases[k]+'\nBASE>>>':'')+'\nSe o pedido envolver conteúdo sexual, +18, violência extrema ou ilegal, responda somente: RECUSADO'},
parse(t){t=t.replace(/<<<PLAN[\s\S]*?(PLAN>>>|$)/,'');const h=t.match(/<<<HTML\s*([\s\S]*?)\s*(?:HTML>>>|$)/);const html=h?h[1].replace(/^\s*```(?:html)?\s*/i,'').replace(/```\s*$/,'').trim():'';return{txt:t.replace(/<<<HTML[\s\S]*$/,'').trim(),html}},
render(txt){return txt.split(/^### /m).filter(x=>x.trim()).map(b=>{const i=b.indexOf('\n');return '<h4>'+esc(b.slice(0,i<0?b.length:i).trim())+'</h4>'+esc(i<0?'':b.slice(i).trim())}).join('')},
async run(kind,type,txt,onPart){if(!Site.left())throw new Error('limite');Site.count();const sample=window.claude?await window.claude.use('sample'):null;
 const bk=this.pick(txt,type),fb=()=>bk?this.bases[bk]:Site.template({type:'Landing page',name:'Meu projeto',desc:txt,style:'escuro'});
 if(!sample)return{txtHtml:kind==='builder'?AI.build(type,txt):AI.idea(txt),html:fb(),ai:false,base:bk?this.labels[bk]:''};
 const r=await sample([{role:'user',content:this.prompt(kind,type,txt)}],{cache:false,onText:o=>onPart&&onPart(this.parse(o.text))});const t=String(r.text);
 if(/^\s*RECUSADO/.test(t)||!Safe.ok(t))throw new Error('recusado');const p=this.parse(t);return{txtHtml:this.render(p.txt),html:/<(html|body)[\s>]/i.test(p.html)&&p.html.length<250000?p.html:fb(),ai:true}},
async edit(html,req){const before=Site.used();try{return await this.edit0(html,req)}catch(e){if(Site.used()>before&&e.message!=='recusado')Site.refund();throw e}},
async edit0(html,req){if(!Site.left())throw new Error('limite');const sample=window.claude?await window.claude.use('sample'):null;if(!sample)throw new Error('offline');Site.count();
 const q='Aqui está um protótipo em HTML. Aplique este pedido sem remover o que já funciona: "'+req+'". Se o pedido envolver conteúdo sexual, +18, violência extrema ou ilegal, responda somente RECUSADO. Caso contrário devolva SOMENTE o HTML completo atualizado, começando em <!DOCTYPE html>, sem recursos externos.\n\n'+html;
 const r=await sample([{role:'user',content:q}],{cache:false});const t=String(r.text);if(/^\s*RECUSADO/.test(t)||!Safe.ok(t))throw new Error('recusado');const h=t.replace(/^\s*```(?:html)?\s*/i,'').replace(/```\s*$/,'').trim();if(!/<(html|body)[\s>]/i.test(h)||h.length>250000)throw new Error('invalido');return h},
full(h){const d=document.createElement('div');d.style.cssText='position:fixed;inset:0;z-index:90;background:#000';d.innerHTML='<iframe sandbox="allow-scripts" title="Protótipo em tela cheia" style="position:absolute;inset:0;width:100%;height:100%;border:0"></iframe><button aria-label="Fechar" style="position:absolute;left:4px;top:calc(4px + env(safe-area-inset-top,0px));z-index:2;width:30px;height:30px;border-radius:50%;border:1px solid rgba(255,255,255,.5);background:rgba(0,0,0,.65);color:#fff;font:700 14px system-ui">✕</button>';d.querySelector('iframe').srcdoc=h;d.querySelector('button').onclick=()=>d.remove();document.body.appendChild(d)},
err(e){return e.message==='recusado'?Safe.MSG:e.message==='limite'?'Você chegou ao limite de '+Site.limit+' gerações hoje. Volte amanhã!':e.message==='offline'?this.offMsg:'Não foi possível aplicar agora. Tente de novo.'},
start(kind,type,txt){const d=S.draft={kind,type,txt,status:'run',part:null,r:null},before=Site.used();
Gen.run(kind,type,txt,q=>{if(S.draft!==d)return;d.part=q;Gen.paint()}).then(r=>{if(S.draft!==d)return;d.status='done';d.r=r;if(kind==='ideia'&&!S.ideas.includes(txt))S.ideas.push(txt);App.save();Gen.paint();if(S.page!=='criar')App.toast('Seu protótipo ficou pronto! Veja em Criar.')}).catch(e=>{if(S.draft!==d)return;if(Site.used()>before&&e.message!=='recusado')Site.refund();S.draft=null;const m=e.message==='recusado'?Safe.MSG:e.message==='limite'?'Você chegou ao limite de '+Site.limit+' gerações hoje. Volte amanhã!':'Não foi possível gerar agora. Seu crédito não foi gasto. Tente de novo.',io=$('#io');if(io){io.innerHTML='<div class="empty">'+m+'</div>';Gen.paint0()}else App.toast(m)})},
paint0(){const b=$('#ib');if(b)b.disabled=!!S.draft&&S.draft.status==='run';const l=$('#il');if(l)l.textContent='Gerações restantes hoje: '+Site.left()+' de '+Site.limit},
paint(){const io=$('#io'),d=S.draft;if(!io)return;this.paint0();if(!d){io.innerHTML='';return}if(d.kind!==(S.tab==='builder'?'builder':'ideia'))return;
 if(d.status==='run'){const q=d.part;io.innerHTML='<div class="card out">'+(q?this.render(q.txt):'')+'<div class="spin"></div><p class="mu">'+(q&&q.html?'Montando o protótipo…':'Gerando…')+' Jogos completos podem levar 1 a 2 minutos. Pode sair desta tela: o resultado fica guardado aqui.</p></div>'}else if(d.status==='done')this.show(io,d)},
show(io,d){const r=d.r;io.innerHTML=`<div class="card" style="border-color:var(--gold)"><b>Protótipo guardado</b><p class="mu" style="font-size:13px;margin:4px 0 0">Ele fica aqui até você salvar no Laboratório ou descartar. Pode sair da tela sem perder.</p></div><div class="card out" style="margin-top:14px">${r.txtHtml}</div><div class="card" style="margin-top:14px"><h4 class="mh">Protótipo</h4><iframe id="gp" sandbox="allow-scripts" title="Protótipo" style="width:100%;height:420px;border:1px solid var(--line);border-radius:12px;background:#fff"></iframe><p class="mu" style="font-size:13px">${r.ai?'Gerado com IA a partir da sua ideia.':(r.base?'Modo offline: protótipo base de '+r.base+'. Com a IA conectada, ele é adaptado à sua ideia.':'Modo offline: protótipo básico. Com a IA conectada, ele fica fiel à sua ideia.')}</p><div class="ask" style="margin:0 0 10px;max-width:none"><input id="gq" aria-label="Pedir mudança" placeholder="Peça uma mudança. Ex.: adicione um ranking" maxlength="200"><button class="btn pri sm" id="g4">Aplicar</button></div><p><button class="btn pri sm" id="g5">Tela cheia</button> <button class="btn sm" id="g1">Editar no Studio</button> <button class="btn sm" id="g3">Copiar código</button></p><p><button class="btn pri sm" id="g2">Salvar no Laboratório</button> <button class="btn sm" id="g6">Descartar</button></p></div>`;
$('#gp').srcdoc=r.html;
$('#g5').onclick=()=>Gen.full(r.html);
$('#g1').onclick=()=>{S.code=r.html;S.tab='studio';App.go('criar')};
$('#g2').onclick=()=>App.saveDraft();
$('#g6').onclick=()=>{const b=$('#g6');if(b.dataset.c){S.draft=null;App.save();App.go('criar',1)}else{b.dataset.c=1;b.textContent='Confirmar descarte'}};
$('#g3').onclick=async()=>{try{await navigator.clipboard.writeText(r.html);App.toast('Código copiado!')}catch(e){App.toast('Abra no Studio e copie de lá.')}};
$('#g4').onclick=async()=>{const q=$('#gq').value.trim();if(!q)return App.toast('Escreva o que mudar.');if(!Safe.check(q))return;const b=$('#g4');b.disabled=true;b.textContent='Aplicando…';try{r.html=await Gen.edit(r.html,q);$('#gp').srcdoc=r.html;$('#gq').value='';App.save();Gen.paint0();App.toast('Pronto! Alteração aplicada.')}catch(e){App.toast(Gen.err(e));Gen.paint0()}b.disabled=false;b.textContent='Aplicar'}}};
Gen.base="<!DOCTYPE html><html lang=\"pt-BR\"><head><meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover\">\n<title>Moto Trail<\/title>\n<style>\n*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}\nhtml,body{margin:0;height:100%;overflow:hidden;background:#05070f;color:#e8ecff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;touch-action:none}\n#c{position:fixed;left:0;top:0;width:100%;height:100%;display:block}\n.hud{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;gap:6px;padding:calc(8px + env(safe-area-inset-top,0px)) 10px 0;pointer-events:none}\n.hud div{background:rgba(5,7,15,.55);border:1px solid rgba(120,150,255,.35);border-radius:12px;padding:5px 10px;min-width:64px;text-align:center;font:800 19px system-ui;text-shadow:0 2px 6px #000}\n.hud b{display:block;font:700 9px system-ui;letter-spacing:.16em;color:#9fb0ff}\n.hud2{position:fixed;left:12px;right:12px;top:calc(64px + env(safe-area-inset-top,0px));display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}\n#spd{font:900 36px system-ui;text-shadow:0 2px 8px #000}#spd small{font-size:12px;color:#9fb0ff;margin-left:3px}\n#nit{width:120px;height:10px;border-radius:9px;background:rgba(255,255,255,.15);overflow:hidden;border:1px solid rgba(255,255,255,.3)}#nit i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#22d3ee,#8b5cf6)}\n#pb{position:fixed;left:12px;right:12px;top:calc(112px + env(safe-area-inset-top,0px));height:6px;border-radius:6px;background:rgba(255,255,255,.14);pointer-events:none}#pb i{position:absolute;top:-3px;width:12px;height:12px;border-radius:50%;border:2px solid #05070f;transform:translateX(-50%)}\n.ctl{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:flex-end}\n.ctl button{border:2px solid rgba(255,255,255,.35);background:rgba(10,14,30,.55);color:#fff;border-radius:50%;font:800 13px system-ui;touch-action:none}\n.ctl button.on{background:rgba(59,130,246,.75);border-color:#fff}\n#L{left:12px}#R{right:12px}#L button{width:78px;height:78px;font-size:28px}#gas{width:98px;height:98px;background:rgba(34,211,238,.35)!important}#brk,#nbtn{width:62px;height:62px}\n#big{position:fixed;left:0;right:0;top:32%;text-align:center;font:900 92px system-ui;color:#fff;text-shadow:0 6px 30px rgba(59,130,246,.9);pointer-events:none}\n#mute{position:fixed;right:12px;top:calc(124px + env(safe-area-inset-top,0px));background:rgba(5,7,15,.55);border:1px solid rgba(120,150,255,.35);color:#fff;border-radius:10px;padding:4px 9px;font-size:16px}\n.ov{position:fixed;inset:0;background:rgba(5,7,15,.84);display:flex;flex-direction:column;align-items:center;padding:calc(18px + env(safe-area-inset-top,0px)) 16px 24px;overflow:auto;touch-action:pan-y}\n.ov h1{margin:6px 0 2px;font:900 36px system-ui;letter-spacing:.06em;background:linear-gradient(120deg,#3b82f6,#8b5cf6,#22d3ee);-webkit-background-clip:text;background-clip:text;color:transparent}\n.ov h3{margin:14px 0 8px;font-size:13px;letter-spacing:.14em;color:#9fb0ff}\n.ov p{color:#9fb0ff;margin:4px 0 8px;text-align:center;font-size:14px}\n.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:560px}\n.cd{width:128px;padding:10px;border:1px solid rgba(120,150,255,.3);border-radius:14px;background:rgba(255,255,255,.05);cursor:pointer;text-align:left;font-size:12px;color:#e8ecff}\n.cd.on{border-color:#22d3ee;box-shadow:0 0 18px rgba(34,211,238,.35)}.cd b{display:block;font-size:14px;margin-bottom:6px}\n.br{height:5px;border-radius:4px;background:rgba(255,255,255,.14);margin:3px 0 6px}.br i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#3b82f6,#22d3ee)}\n.dc{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}\n.go{margin-top:18px;border:0;border-radius:14px;padding:14px 34px;font:800 17px system-ui;color:#fff;background:linear-gradient(120deg,#3b82f6,#8b5cf6 55%,#22d3ee);box-shadow:0 8px 30px rgba(99,102,241,.45);cursor:pointer}\n.go.sec{background:rgba(255,255,255,.1);box-shadow:none;margin-left:8px}\n.lst{width:min(360px,100%);margin:6px 0}.lst div{display:flex;justify-content:space-between;padding:7px 12px;border-radius:10px;font-weight:700}.lst .me{background:rgba(34,211,238,.2)}\n<\/style><\/head><body>\n<canvas id=\"c\"><\/canvas>\n<div class=\"hud\" id=\"hud\" style=\"display:none\"><div><b>POSIÇÃO<\/b><span id=\"pos\">6/6<\/span><\/div><div><b>TEMPO<\/b><span id=\"tm\">0:00.00<\/span><\/div><div><b>VOLTA<\/b><span id=\"lap\">1/3<\/span><\/div><\/div>\n<div class=\"hud2\" id=\"hud2\" style=\"display:none\"><div id=\"spd\">0<small>km/h<\/small><\/div><div><div id=\"nit\"><i><\/i><\/div><\/div><\/div>\n<div id=\"pb\" style=\"display:none\"><\/div>\n<button id=\"mute\" style=\"display:none\" aria-label=\"Som\">🔊<\/button>\n<div id=\"big\"><\/div>\n<div class=\"ctl\" id=\"L\" style=\"display:none\"><button data-k=\"l\" aria-label=\"Esquerda\">◀<\/button><button data-k=\"r\" aria-label=\"Direita\">▶<\/button><\/div>\n<div class=\"ctl\" id=\"R\" style=\"display:none\"><div style=\"display:flex;flex-direction:column;gap:10px\"><button id=\"nbtn\" data-k=\"n\">NITRO<\/button><button id=\"brk\" data-k=\"b\">FREIO<\/button><\/div><button id=\"gas\" data-k=\"g\">GAS<\/button><\/div>\n<div class=\"ov\" id=\"menu\"><h1>MOTO TRAIL<\/h1><p>Corrida de motocross em primeira pessoa. 3 voltas, 5 rivais, rampas e nitro.<\/p><h3>ESCOLHA SUA MOTO<\/h3><div class=\"row\" id=\"bk\"><\/div><h3>ESCOLHA A PISTA<\/h3><div class=\"row\" id=\"tk\"><\/div><button class=\"go\" id=\"start\">CORRER<\/button><p style=\"font-size:12px;margin-top:12px\">Toque: ◀ ▶ direção, GAS acelera. Teclado: setas e espaço (nitro).<\/p><\/div>\n<div class=\"ov\" id=\"end\" style=\"display:none\"><h1 id=\"et\">FIM DA CORRIDA<\/h1><p id=\"es\"><\/p><div class=\"lst\" id=\"el\"><\/div><div><button class=\"go\" id=\"again\">CORRER DE NOVO<\/button><button class=\"go sec\" id=\"tomenu\">MENU<\/button><\/div><\/div>\n<script>\n(()=>{\nconst $=s=>document.querySelector(s),cv=$('#c'),cx=cv.getContext('2d');\nlet W=2,H=2,K=1;\nconst size=()=>{K=Math.min(devicePixelRatio||1,1.5)*(innerWidth<700?.8:1);W=cv.width=Math.max(2,innerWidth*K|0);H=cv.height=Math.max(2,innerHeight*K|0)};size();addEventListener('resize',size);\nconst SEG=200,RUM=3,RW=2000,CH=900,CD=1/Math.tan(50*Math.PI/180),PZ=CH*CD,LAPS=3,DRAW=innerWidth<700?100:150;\nconst lerp=(a,b,p)=>a+(b-a)*p,cl=(v,a,b)=>Math.max(a,Math.min(b,v)),hex=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));\nconst BIKES=[{n:'Trail 250',c:'#ff7a1a',max:10600,acc:1,han:1},{n:'Cross Rex',c:'#2f7bff',max:11400,acc:.9,han:.9},{n:'Enduro Pro',c:'#25c26e',max:10000,acc:1.15,han:1.2},{n:'Thunder 450',c:'#e5334d',max:12400,acc:.8,han:.75}];\nconst TRACKS=[\n{n:'Vale Verde',sky:['#5ab4ff','#dff3ff'],sun:'#fff6c2',hill:['#7fb08c','#5c9170','#3f7355'],grass:['#4fa65a','#439a4f'],road:['#7a6652','#6e5c49'],rum:['#f0f0f0','#d9363e'],fog:'#cfe9ff',deco:'tree',lay:[['s',20],['c',40,2],['h',50,16],['s',20],['r'],['s',30],['c',50,-3],['c',40,3],['h',40,-14],['s',25],['r'],['c',60,-2],['s',30],['h',60,24],['c',40,4],['h',60,-24],['s',20],['r'],['c',50,-4],['s',40],['c',50,2],['s',30]]},\n{n:'Deserto Rubi',sky:['#ff8f5a','#ffe3b8'],sun:'#fff0c0',hill:['#d99a6c','#c27d52','#a86338'],grass:['#e0b46a','#d3a35a'],road:['#8a6a4a','#7d5f42'],rum:['#ffffff','#e0412e'],fog:'#ffd9ab',deco:'cactus',lay:[['s',40],['r'],['s',40],['c',60,2],['h',80,22],['s',30],['r'],['c',70,-3],['s',50],['h',70,-22],['r'],['s',40],['c',50,3],['c',50,-3],['s',30],['r'],['s',60]]},\n{n:'Montanha Neon',night:1,sky:['#070a22','#3b2a78'],sun:'#c9b6ff',hill:['#2a2a68','#1d1d52','#12123a'],grass:['#10213a','#0c1a30'],road:['#2a2f45','#232839'],rum:['#22d3ee','#ec4899'],fog:'#1b1646',deco:'neon',lay:[['s',25],['c',45,3],['c',45,-4],['h',50,20],['r'],['c',60,5],['s',20],['h',50,-20],['c',40,-5],['r'],['c',60,4],['s',25],['h',50,26],['c',35,-3],['h',50,-26],['r'],['c',45,3],['s',30],['c',45,-3],['s',30]]}];\nconst NAMES=['Rafa','Duda','Bia','Léo','Nina'],RCOL=['#f2c200','#b84dff','#ff5fa2','#17c3b2','#e8e8e8'];\nlet T,segs=[],len=0,bi=0,ti=0,BK=BIKES[0],stars=[],rs=7;\nconst rnd=()=>(rs=(rs*16807)%2147483647)/2147483647;\nconst mix=(c,f)=>'rgb('+((c[0]+(T.F[0]-c[0])*f)|0)+','+((c[1]+(T.F[1]-c[1])*f)|0)+','+((c[2]+(T.F[2]-c[2])*f)|0)+')';\nfunction build(){segs=[];const ly=()=>segs.length?segs[segs.length-1].p2.w.y:0;\n const add=(cv0,y,rp)=>{const n=segs.length;segs.push({i:n,p1:{w:{y:ly(),z:n*SEG},c:{},s:{}},p2:{w:{y:y,z:(n+1)*SEG},c:{},s:{}},curve:cv0,dark:Math.floor(n/RUM)%2,ramp:!!rp,jump:false,rs:false,sc:[]})};\n const eI=(a,b,p)=>a+(b-a)*p*p,eO=(a,b,p)=>a+(b-a)*(1-Math.pow(1-p,2)),eIO=(a,b,p)=>a+(b-a)*(-Math.cos(p*Math.PI)/2+.5);\n const road=(e,h,l,c,y,rp)=>{const y0=ly(),y1=y0+y*SEG,tot=e+h+l;for(let n=0;n<e;n++)add(eI(0,c,n/e),eIO(y0,y1,n/tot),rp);for(let n=0;n<h;n++)add(c,eIO(y0,y1,(e+n)/tot),rp);for(let n=0;n<l;n++)add(eO(c,0,n/l),eIO(y0,y1,(e+h+n)/tot),rp)};\n for(const o of T.lay){const m=(o[1]||0)*1.8|0;if(o[0]==='s')for(let i=0;i<m;i++)add(0,ly());else if(o[0]==='c'){const a=m/3|0;road(a,a,a,o[2],0)}else if(o[0]==='h'){const a=m/3|0;road(a,a,a,0,o[2]*1.2)}else{const st=segs.length;road(0,9,0,0,6,true);for(let k=1;k<=4;k++)segs[segs.length-k].jump=true;segs[st].rs=true;road(0,5,0,0,-6)}}\n for(let i=0;i<24;i++)add(0,ly());\n len=segs.length*SEG;\n for(const s of segs){if(s.i%4===0&&!s.ramp&&rnd()<.8)s.sc.push({t:T.deco,x:(rnd()<.5?-1:1)*(1.35+rnd()*2.2),v:rnd()});if(s.i%4===2&&rnd()<.5)s.sc.push({t:T.deco,x:(rnd()<.5?-1:1)*(1.6+rnd()*3),v:rnd()});if(s.i%30===0)s.sc.push({t:'flag',x:-1.18,v:0},{t:'flag',x:1.18,v:1});if(s.rs)s.sc.push({t:'sign',x:-1.2,v:0},{t:'sign',x:1.2,v:1})}}\nfunction loadTrack(i){ti=i;T=TRACKS[i];T.F=hex(T.fog);T.c={gl:hex(T.grass[0]),gd:hex(T.grass[1]),rl:hex(T.road[0]),rd:hex(T.road[1]),ul:hex(T.rum[0]),ud:hex(T.rum[1]),rp:hex(T.night?'#4a3f7a':'#b88446'),ln:hex('#ffffff')};rs=7+i*13;build();stars=Array.from({length:70},()=>[rnd(),rnd()*.48,rnd()*1.6+.4])}\nconst segAt=z=>segs[Math.floor(z/SEG)%segs.length];\n// ---- estado\nconst Kb={l:0,r:0,g:0,b:0,n:0};let st='menu',pos=0,px=0,spd=0,alt=0,air=0,pv=0,ss=0,nit=1,lap=0,tm=0,cd=0,shk=0,bob=0,tread=0,skyO=0,t=0,fr=0,mute=0,bestMsg='';\nlet rivals=[],parts=[],lastRank=6,landed=0;\nconst prog=()=>lap*len+pos+PZ;\nfunction reset(){BK=BIKES[bi];loadTrack(ti);pos=0;px=0;spd=0;alt=0;air=0;pv=0;ss=0;nit=1;lap=0;tm=0;shk=0;parts=[];\n rivals=NAMES.map((n,k)=>({n,c:RCOL[k],z:PZ+300*(k+1),lap:0,x:[-.65,.55,-.2,.2,.7][k],ph:k*1.7,base:9400+k*330,spd:0,fin:0}))}\n// ---- áudio\nlet ac,osc,gn;function snd(){if(ac)return;try{ac=new(window.AudioContext||window.webkitAudioContext)();osc=ac.createOscillator();osc.type='sawtooth';const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=650;gn=ac.createGain();gn.gain.value=0;osc.connect(lp);lp.connect(gn);gn.connect(ac.destination);osc.start()}catch(e){ac=null}}\nfunction sfx(f,d,v){if(!ac||mute)return;try{const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);o.stop(ac.currentTime+d)}catch(e){}}\n// ---- controles\nconst km={ArrowLeft:'l',a:'l',ArrowRight:'r',d:'r',ArrowUp:'g',w:'g',ArrowDown:'b',s:'b',' ':'n',Shift:'n'};\naddEventListener('keydown',e=>{const k=km[e.key];if(k){Kb[k]=1;e.preventDefault()}});addEventListener('keyup',e=>{const k=km[e.key];if(k)Kb[k]=0});\ndocument.querySelectorAll('[data-k]').forEach(b=>{const k=b.dataset.k,up=()=>{Kb[k]=0;b.classList.remove('on')};b.addEventListener('pointerdown',e=>{Kb[k]=1;b.classList.add('on');try{b.setPointerCapture(e.pointerId)}catch(x){}e.preventDefault()});b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('lostpointercapture',up)});\n// ---- partículas\nfunction dust(x,y,n,col,sp){for(let i=0;i<n;i++)parts.push({x:x+(Math.random()-.5)*20*K,y,vx:(Math.random()-.5)*sp*K,vy:-Math.random()*sp*.5*K,r:(3+Math.random()*5)*K,l:.7,m:.7,c:col})}\n// ---- física\nfunction update(dt){\n t+=dt;fr++;\n if(st==='menu'){pos=(pos+4200*dt)%len;px=Math.sin(t*.5)*.35;spd=6000;ss=Math.cos(t*.5)*.4;tread+=spd*dt*.02;skyO+=segAt(pos+PZ).curve*dt*30;return}\n if(st==='cd'){cd-=dt;if(cd>0)$('#big').textContent=Math.ceil(cd);else{st='race';$('#big').textContent='VAI!';setTimeout(()=>{if(st==='race')$('#big').textContent=''},700);sfx(660,.35,.2)}return}\n if(st!=='race')return;\n tm+=dt;\n const B=BK,ps=segAt(pos+PZ),sp=cl(spd/B.max,0,1.3),boost=Kb.n&&nit>.02,eff=B.max*(boost?1.22:1);\n if(boost)nit=Math.max(0,nit-.34*dt);else nit=Math.min(1,nit+.09*dt);\n const acc=B.max/(4/B.acc)*(boost?1.9:1);\n if(Kb.g)spd+=acc*dt;else if(Kb.b)spd-=B.max/1.5*dt;else spd-=B.max/7*dt;\n const si=(Kb.r?1:0)-(Kb.l?1:0),ctl=air?.45:1;\n px+=si*dt*2.2*cl(sp*1.2,.3,1)*B.han*ctl;px-=dt*2*sp*sp*ps.curve*.32;ss+=(si-ss)*Math.min(1,dt*7);\n const off=(px<-1||px>1);if(off&&spd>B.max/4){spd-=B.max/2.4*dt;if(fr%2===0)dust(W/2+(px>0?1:-1)*70*K,H*.84,1,'rgba(150,120,80,',160)}\n px=cl(px,-2.2,2.2);spd=cl(spd,0,eff);\n pos+=spd*dt;if(pos>=len){pos-=len;lap++;if(lap>=LAPS)return finish();$('#big').textContent='VOLTA '+(lap+1);setTimeout(()=>{if(st==='race')$('#big').textContent=''},900)}\n // pulo\n const cs=segAt(pos+PZ),pc=((pos+PZ)%SEG)/SEG,ry=lerp(cs.p1.w.y,cs.p2.w.y,pc);\n if(!air){alt=ry;if(cs.jump&&spd>B.max*.25){air=1;pv=spd*.34;sfx(180,.15,.12)}}\n else{alt+=pv*dt;pv-=9000*dt;if(alt<=ry){alt=ry;air=0;const hard=Math.min(1,Math.abs(pv)/3500);shk=.5+hard*.6;bob=18*hard;nit=Math.min(1,nit+.12);spd*=1-.04*hard;dust(W/2,H*.82,16,'rgba(190,160,110,',260);sfx(70,.25,.35);landed++}}\n if(!air){bob+=(0-bob)*Math.min(1,dt*9);tread+=spd*dt*.02}else tread+=spd*dt*.02;\n shk*=Math.pow(.02,dt);skyO+=cs.curve*sp*dt*60;\n // rivais\n const pp=prog();\n for(const r of rivals){const rs0=segAt(r.z),rp=r.lap*len+r.z,gap=cl(1+(pp-rp)/(len*.45),.9,1.12),tgt=r.base*gap*(1-Math.abs(rs0.curve)*.02);r.spd+=(tgt-r.spd)*Math.min(1,dt*1.2);r.z+=r.spd*dt;if(r.z>=len){r.z-=len;r.lap++}r.xx=cl(r.x+Math.sin(t*.6+r.ph)*.14,-.9,.9)}\n // colisão\n for(const r of rivals){const d=(r.lap*len+r.z)-pp;if(Math.abs(d)<260&&Math.abs(r.xx-px)<.2&&!air){spd=Math.min(spd,r.spd*.92);px+=(px>=r.xx?1:-1)*.05;shk=.5;sfx(120,.1,.15)}}\n // partículas de terra\n if(!air&&spd>B.max*.45&&fr%3===0)dust(W/2+(Math.random()<.5?-1:1)*50*K,H*.86,1,'rgba(160,130,90,',110);\n hud()}\nfunction rank(){const pp=prog();let r=1;for(const q of rivals)if(q.lap*len+q.z>pp)r++;return r}\nfunction fmt(s){const m=Math.floor(s/60),x=s-m*60;return m+':'+(x<10?'0':'')+x.toFixed(2)}\nfunction hud(){if(fr%3)return;lastRank=rank();$('#pos').textContent=lastRank+'/6';$('#tm').textContent=fmt(tm);$('#lap').textContent=Math.min(lap+1,LAPS)+'/'+LAPS;$('#spd').firstChild.nodeValue=Math.round(spd/BK.max*(80+BK.max/160));$('#nit i').style.width=(nit*100)+'%';const m=document.querySelectorAll('#pb i');const f=x=>Math.min(99,Math.max(0,((x%len)/len)*100))+'%';if(m.length===6){m[0].style.left=f(pos+PZ);rivals.forEach((r,k)=>m[k+1].style.left=f(r.z))}}\nfunction finish(){st='end';const pp=prog(),list=[{n:'Você',p:pp,me:1},...rivals.map(r=>({n:r.n,p:r.lap*len+r.z}))].sort((a,b)=>b.p-a.p);let best=0;try{const k='mt'+ti,o=+localStorage.getItem(k)||0;best=o;if(!o||tm<o){localStorage.setItem(k,tm);best=tm;bestMsg=o?'Novo recorde!':'Primeiro recorde!'}else bestMsg=''}catch(e){bestMsg=''}\n const pos1=list.findIndex(x=>x.me)+1;$('#et').textContent=pos1===1?'VITÓRIA!':pos1+'º LUGAR';$('#es').textContent='Tempo: '+fmt(tm)+(best?'  ·  Recorde: '+fmt(best):'')+(bestMsg?'  ·  '+bestMsg:'');\n $('#el').innerHTML=list.map((x,k)=>'<div class=\"'+(x.me?'me':'')+'\"><span>'+(k+1)+'º '+x.n+'<\/span><\/div>').join('');['hud','hud2','pb','mute','L','R'].forEach(i=>$('#'+i).style.display='none');$('#end').style.display='flex';sfx(520,.5,.2)}\n// ---- desenho\nconst poly=(a,b,c,d,e,f,g,h,col)=>{cx.fillStyle=col;cx.beginPath();cx.moveTo(a,b);cx.lineTo(c,d);cx.lineTo(e,f);cx.lineTo(g,h);cx.closePath();cx.fill()};\nconst tri=(x,y,w,h,c)=>{cx.fillStyle=c;cx.beginPath();cx.moveTo(x-w,y);cx.lineTo(x+w,y);cx.lineTo(x,y-h);cx.fill()};\nconst rr=(x,y,w,h,r)=>{cx.beginPath();cx.moveTo(x+r,y);cx.arcTo(x+w,y,x+w,y+h,r);cx.arcTo(x+w,y+h,x,y+h,r);cx.arcTo(x,y+h,x,y,r);cx.arcTo(x,y,x+w,y,r);cx.closePath()};\nfunction proj(p,camX,camY,camZ){const c=p.c,s=p.s;c.x=-camX;c.y=p.w.y-camY;c.z=p.w.z-camZ;s.scale=CD/c.z;s.x=Math.round(W/2+s.scale*c.x*W/2);s.y=Math.round(H/2-s.scale*c.y*H/2);s.w=Math.round(s.scale*RW*W/2)}\nfunction bg(){const g=cx.createLinearGradient(0,0,0,H*.52);g.addColorStop(0,T.sky[0]);g.addColorStop(1,T.sky[1]);cx.fillStyle=g;cx.fillRect(0,0,W,H*.53);\n if(T.night){cx.fillStyle='#fff';for(const s of stars){cx.globalAlpha=.4+.5*Math.abs(Math.sin(t*1.5+s[0]*30));cx.fillRect(s[0]*W,s[1]*H,s[2]*K,s[2]*K)}cx.globalAlpha=1}\n const sx=W*.72,sy=H*.28,r=H*.06,sg=cx.createRadialGradient(sx,sy,r*.2,sx,sy,r*3.2);sg.addColorStop(0,T.sun);sg.addColorStop(.22,T.sun);sg.addColorStop(1,'rgba(255,255,255,0)');cx.globalAlpha=T.night?.6:.9;cx.fillStyle=sg;cx.beginPath();cx.arc(sx,sy,r*3.2,0,7);cx.fill();cx.globalAlpha=1;\n if(!T.night){cx.fillStyle='rgba(255,255,255,.55)';for(let i=0;i<5;i++){const x=((i*W*.27+t*9-skyO*.15)%(W+200)+W+200)%(W+200)-100,y=H*(.1+.05*(i%3));cx.beginPath();cx.ellipse(x,y,70*K,18*K,0,0,7);cx.ellipse(x+40*K,y-8*K,45*K,16*K,0,0,7);cx.fill()}}\n for(let L=0;L<3;L++){cx.fillStyle=T.hill[L];cx.beginPath();cx.moveTo(0,H*.5+2);const amp=H*(.11-L*.025),f=.004+L*.003,o=skyO*(.3+L*.4);for(let x=0;x<=W+20;x+=20){cx.lineTo(x,H*.5-amp*(.55+.45*Math.sin((x+o)*f+L)+.28*Math.sin((x+o)*f*2.3+L*2)))}cx.lineTo(W,H*.5+2);cx.closePath();cx.fill()}\n cx.fillStyle=mix(T.c.gl,.55);cx.fillRect(0,H*.5,W,H*.5)}\nfunction spriteScenery(o,x,y,u,f){cx.globalAlpha=cl(1-f*1.1,0,1);cons eco==='cactus'?'Saltos longos':'Rampas e curvas')+'<\/div>').join('');\n document.querySelectorAll('[data-b]').forEach(e=>e.onclick=()=>{bi=+e.dataset.b;BK=BIKES[bi];menu()});document.querySelectorAll('[data-t]').forEach(e=>e.onclick=()=>{ti=+e.dataset.t;loadTrack(ti);pos=0;menu()})}\nfunction go(){snd();reset();const pb=$('#pb');pb.innerHTML='<i style=\"background:#22d3ee\"><\/i>'+RCOL.map(c=>'<i style=\"background:'+c+'\"><\/i>').join('');['hud','hud2','pb','mute','L','R'].forEach(i=>$('#'+i).style.display='');$('#hud2').style.display='flex';$('#L').style.display='flex';$('#R').style.display='flex';$('#menu').style.display='none';$('#end').style.display='none';st='cd';cd=3.2}\nfunction toMenu(){st='menu';reset();$('#end').style.display='none';$('#menu').style.display='flex';['hud','hud2','pb','mute','L','R'].forEach(i=>$('#'+i).style.display='none');$('#big').textContent='';menu()}\n$('#start').onclick=go;$('#again').onclick=go;$('#tomenu').onclick=toMenu;$('#mute').onclick=()=>{mute=!mute;$('#mute').textContent=mute?'🔇':'🔊'};\nloadTrack(0);reset();st='menu';menu();\nlet last=0;const frame=ts=>{const dt=Math.min(.05,(ts-last)/1000||0);last=ts;try{update(dt);render()}catch(e){console.error(e)}requestAnimationFrame(frame)};requestAnimationFrame(frame);\nwindow.__mt={get:()=>({st,pos,spd,lap,px,alt,air,landed,rank:lastRank,len,nit,tm}),set:o=>{if('pos'in o)pos=o.pos;if('lap'in o)lap=o.lap;if('spd'in o)spd=o.spd}};\n})();\n<\/script><\/body><\/html>\n";

const Inv={tab:'comecar',qi:0,qs:0,tabs:[['comecar','Começar'],['ativos','Principais'],['truques','Truques'],['sim','Simulador'],['quiz','Quiz']],
steps:[['Organize as dívidas caras',`Cartão rotativo e cheque especial cobram juros muito altos. Quitar isso costuma valer mais do que qualquer investimento.`],['Monte a reserva de emergência',`Guarde o equivalente a 3 a 6 meses de gastos (autônomos: 6 a 12) em algo seguro e com resgate rápido, como Tesouro Selic ou um CDB com liquidez diária.`],['Defina objetivo e prazo',`Dinheiro para os próximos meses pede segurança. Dinheiro para daqui a 10 anos pode aceitar mais oscilação.`],['Abra uma conta em corretora',`Nem todo banco oferece bolsa de valores. Se o seu não oferece, uma corretora independente resolve: confira se ela é autorizada pelo Banco Central ou pela CVM, faça o cadastro com seu CPF e transfira dinheiro de uma conta no seu nome. Abrir conta costuma ser gratuito, mas confira as taxas.`],['Comece pequeno e invista todo mês',`Tesouro Direto aceita valores a partir de cerca de R$ 30. Aportar todo mês importa mais do que começar com muito.`],['Estude antes de arriscar',`Entenda o que está comprando. Se não consegue explicar em duas frases, ainda não é hora de investir nisso.`]],
ativos:[['Poupança','Renda fixa','Baixo','Diária',`Simples e conhecida, mas em geral rende menos do que outras opções de baixo risco.`],['Tesouro Selic','Renda fixa','Baixo','Dia útil',`Título do governo que acompanha a taxa Selic. Muito usado para reserva de emergência.`],['CDB','Renda fixa','Baixo','Varia',`Você empresta dinheiro ao banco e recebe juros. Muitos têm cobertura do FGC (até R$ 250 mil por CPF e instituição; confira a regra atual).`],['LCI e LCA','Renda fixa','Baixo','No prazo',`Letras de crédito imobiliário e do agronegócio. Costumam ter prazo mínimo e regras de imposto próprias, que mudam: confira a atual.`],['Tesouro IPCA+','Renda fixa','Baixo','Dia útil',`Rende a inflação mais uma taxa fixa. Pensado para longo prazo. Se vender antes, o preço pode oscilar.`],['Fundos de investimento','Misto','Médio','Varia',`Um gestor investe por você. Olhe as taxas e o come-cotas, o IR antecipado que muitos fundos cobram em maio e novembro.`],['Fundos imobiliários (FIIs)','Renda variável','Médio','Bolsa',`Fundos que investem em imóveis ou títulos do setor. Você compra cotas na bolsa e pode receber rendimentos mensais. O preço oscila.`],['ETFs','Renda variável','Médio','Bolsa',`Fundos que copiam um índice, como o Ibovespa, e são negociados como ações. Diversificam com uma compra só.`],['Ações','Renda variável','Alto','Bolsa',`Você vira sócio de uma empresa. O preço sobe e desce todo dia e pode haver dividendos. Não há garantia de retorno.`]],
tips:[['Olhe o rendimento líquido',`Compare depois de imposto, taxas e inflação, não o número bruto da propaganda.`],['Compare com o CDI e a Selic',`Se algo promete rendimento menor ou parecido com risco maior, pergunte por que escolher isso.`],['Aporte todo mês',`Investir um valor fixo todo mês tira a pressão de acertar o melhor momento de comprar.`],['Mercado fracionário',`Dá para comprar ações em quantidades pequenas, a partir de 1 unidade. No mercado fracionário o código termina com a letra F, como em PETR4F.`],['Ordem limitada',`Em vez de comprar a qualquer preço, você define o preço máximo (ou mínimo) que aceita. Ajuda em papéis que oscilam rápido.`],['Marcação a mercado',`Um título do Tesouro vendido antes do vencimento pode valer menos do que você pagou. Planeje o prazo antes de comprar.`],['Data com e data ex',`Só recebe o dividendo quem tem o ativo até a data com. O preço costuma se ajustar depois, então comprar só pelo dividendo não é lucro garantido.`],['Reinvista os rendimentos',`Os juros compostos só mostram força com tempo e reinvestimento. Veja no Simulador.`],['Cuidado com os custos',`Uma taxa de administração de 2% ao ano parece pouco, mas come uma parte enorme do resultado em 20 anos.`],['Reserva sempre primeiro',`Nunca coloque em renda variável o dinheiro que você pode precisar nos próximos meses.`],['Revise poucas vezes',`Olhar a carteira toda hora gera decisão por medo. Revise uma ou duas vezes por ano.`],['Day trade é difícil',`Estudos brasileiros mostram que a grande maioria dos day traders perde dinheiro. Para quem está começando, o longo prazo costuma ser mais seguro.`]],
golpe:[`Promessa de ganho garantido ou muito acima do mercado`,`Pressa e urgência: "só hoje", "últimas vagas"`,`Pedem Pix para uma pessoa física, e não para uma instituição`,`Grupos de "sinais" e robôs que prometem lucro automático`,`Ganhar recrutando outras pessoas (pirâmide)`,`A empresa não aparece na lista de autorizadas da CVM ou do Banco Central`,`Pedem sua senha, token ou código de verificação`],
gloss:[['Selic',`Taxa básica de juros do país, definida pelo Banco Central. Influencia quase todos os investimentos.`],['CDI',`Taxa de referência dos empréstimos entre bancos. Muitos CDBs pagam uma porcentagem do CDI.`],['IPCA',`Índice oficial de inflação. Mostra o quanto os preços subiram.`],['Liquidez',`A facilidade e a rapidez de transformar o investimento em dinheiro.`],['Dividendos',`Parte do lucro que algumas empresas dividem com os acionistas.`],['Corretora',`Instituição que dá acesso à bolsa e a outros investimentos.`],['B3',`A bolsa de valores do Brasil, onde ações, FIIs e ETFs são negociados.`],['Ticker',`O código de um ativo na bolsa, como PETR4 ou VALE3.`],['Diversificação',`Dividir o dinheiro em ativos diferentes para não depender de um só.`],['FGC',`Fundo que protege depósitos e alguns títulos de bancos até um limite. Confira as regras atuais.`]],
quiz:[[`Qual destes costuma ser usado para a reserva de emergência?`,[`Ações de uma só empresa`,`Tesouro Selic ou CDB com liquidez diária`,`Uma criptomoeda nova`,`Um fundo imobiliário`],1,`Reserva precisa de segurança e resgate rápido, sem risco de ver o valor cair na hora que você precisa.`],[`O que significa liquidez?`,[`O quanto o investimento rende`,`A facilidade de transformar em dinheiro`,`O imposto cobrado`,`A taxa do banco`],1,`Liquidez é a rapidez e a facilidade para virar dinheiro.`],[`O que define a renda variável?`,[`O retorno é sempre o mesmo`,`O governo garante o valor`,`O preço oscila e o retorno não é previsível`,`Só pode ser comprada em banco`],2,`Ações, FIIs e ETFs mudam de preço todo dia, e você pode ganhar ou perder.`],[`Por que diversificar?`,[`Para pagar menos imposto`,`Para não depender de um único ativo`,`Para ganhar sempre`,`Porque a lei obriga`],1,`Diversificar reduz o impacto de um investimento que vai mal.`],[`Qual é um sinal clássico de golpe?`,[`Fala dos riscos com clareza`,`Mostra que é autorizada pela CVM`,`Promete ganho garantido e alto`,`Pede só o seu CPF para o cadastro`],2,`Nenhum investimento sério garante ganho alto. Desconfie.`],[`O que são juros compostos?`,[`Juros só sobre o valor inicial`,`Juros sobre juros`,`Juros que o governo paga`,`Uma taxa fixa de corretagem`],1,`O rendimento de cada período entra na base do próximo, e o efeito cresce com o tempo.`]],
brl:v=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(v),
render(){const c=$('#iv');if(!c)return;$$('[data-it]').forEach(b=>b.classList.toggle('on',b.dataset.it===this.tab));
 if(this.tab==='comecar')c.innerHTML=`<div class="grid g2">${this.steps.map((x,i)=>`<div class="card"><b class="mh" style="font:700 22px var(--serif);color:var(--gold)">${i+1}</b><h3>${x[0]}</h3><p class="mu" style="margin:6px 0 0">${x[1]}</p></div>`).join('')}</div><h2 class="t">Glossário rápido</h2>${this.gloss.map(x=>`<details class="card"><summary>${x[0]}</summary><p>${x[1]}</p></details>`).join('')}<p style="margin-top:18px"><button class="btn pri" id="ivai">Tirar dúvidas com a IA</button> <button class="btn" id="ivc">Fazer o curso</button></p>`;
 else if(this.tab==='ativos')c.innerHTML=`<p class="sub">Os mais usados, do mais seguro ao mais arriscado. Risco maior pode significar retorno maior ou perda.</p><div class="grid">${this.ativos.map(x=>`<div class="card"><span class="tag ${x[2]==='Baixo'?'m':x[2]==='Alto'?'h':''}">Risco ${x[2].toLowerCase()}</span> <span class="tag">${x[1]}</span><h3 style="margin:10px 0 4px">${x[0]}</h3><small>Resgate: ${x[3]}</small><p class="mu" style="margin:8px 0 0">${x[4]}</p></div>`).join('')}</div>`;
 else if(this.tab==='truques')c.innerHTML=`<p class="sub">Boas práticas que pouca gente conta. Nenhuma delas é promessa de ganho.</p><div class="grid">${this.tips.map(x=>`<div class="card"><h3>${x[0]}</h3><p class="mu" style="margin:6px 0 0">${x[1]}</p></div>`).join('')}</div><h2 class="t">Sinais de golpe</h2><div class="card" style="border-color:var(--wine)"><ul class="f" style="margin:0">${this.golpe.map(x=>`<li style="margin:6px 0">${x}</li>`).join('')}</ul></div>`;

sim(c){c.innerHTML=`<div class="card"><h3>Simulador de juros compostos</h3><p class="mu" style="font-size:13px">Simulação hipotética, não é promessa de ganho. Imposto, taxas e inflação não estão incluídos.</p><label class="mu" style="font-size:13px">Valor inicial (R$)</label><input class="inp" id="s1" type="number" inputmode="decimal" value="100" min="0"><label class="mu" style="font-size:13px">Aporte mensal (R$)</label><input class="inp" id="s2" type="number" inputmode="decimal" value="100" min="0"><label class="mu" style="font-size:13px">Taxa ao ano (%)</label><input class="inp" id="s3" type="number" inputmode="decimal" value="10" min="0" max="60" step="0.5"><label class="mu" style="font-size:13px">Tempo (anos)</label><input class="inp" id="s4" type="number" inputmode="numeric" value="10" min="1" max="50"></div><div class="card" style="margin-top:14px" id="sr"></div>`;
 const cl=(v,a,b)=>Math.max(a,Math.min(b,v)),run=()=>{const v0=Math.max(0,+$('#s1').value||0),m=Math.max(0,+$('#s2').value||0),a=cl(+$('#s3').value||0,0,60)/100,y=Math.round(cl(+$('#s4').value||1,1,50)),r=Math.pow(1+a,1/12)-1;let t=v0;const ser=[];for(let i=1;i<=y*12;i++){t=t*(1+r)+m;if(i%12===0)ser.push(t)}const inv=v0+m*y*12,mx=Math.max(1,...ser);
  $('#sr').innerHTML=`<div class="grid sm"><div><small>Total investido</small><b>${this.brl(inv)}</b></div><div><small>Rendimento</small><b style="color:var(--em)">${this.brl(t-inv)}</b></div><div><small>Total final</small><b style="font-size:20px">${this.brl(t)}</b></div></div><div style="display:flex;align-items:flex-end;gap:2px;height:120px;margin-top:16px">${ser.map(x=>`<div style="flex:1;height:${Math.max(3,x/mx*100)}%;background:var(--gr);border-radius:3px 3px 0 0"></div>`).join('')}</div><small class="mu">Evolução ano a ano</small>`};
 $$('.inp',c).forEach(i=>i.oninput=run);run()},

 $$('[data-q]',c).forEach(b=>b.onclick=()=>{const i=+b.dataset.q;$$('[data-q]',c).forEach(z=>{z.disabled=true;if(+z.dataset.q===x[2])z.style.borderColor='var(--em)';else if(z===b)z.style.borderColor='var(--wine)'});if(i===x[2])this.qs++;$('#qx').innerHTML=`<p class="mu" style="margin:10px 0">${i===x[2]?'Certo! ':'Quase. '}${x[3]}</p><button class="btn pri sm" id="qn">Próxima</button>`;$('#qn').onclick=()=>{this.qi++;this.q(c)}})}};

DATA.lessons['Investimentos para Iniciantes']=[
['Por que investir e a reserva de emergência',`Guardar dinheiro parado perde valor com a inflação. Investir ajuda o seu dinheiro a render. Mas antes de tudo vem a reserva de emergência: de 3 a 6 meses de gastos em algo seguro e de resgate rápido.\n\nExercício: some seus gastos mensais e calcule o valor da sua reserva.`,null],
['Renda fixa: Tesouro, CDB, LCI e LCA',`Na renda fixa você empresta dinheiro e recebe juros. O Tesouro Direto empresta para o governo, o CDB para um banco. Compare sempre o rendimento líquido, o prazo e a liquidez.\n\nExercício: escreva a diferença entre Tesouro Selic e Tesouro IPCA+ com as suas palavras.`,null],
['Renda variável: ações, FIIs e ETFs',`Na renda variável o preço muda todo dia e não há garantia de retorno. Ações são parte de uma empresa, FIIs investem em imóveis e ETFs copiam um índice. Quanto maior o prazo, menor o peso das oscilações do dia a dia.\n\nExercício: escolha uma empresa que você conhece e liste o que ela vende e como ganha dinheiro.`,null],
['Risco, diversificação e golpes',`Nenhum investimento sério garante ganho alto. Diversificar reduz o risco de depender de um só ativo. Desconfie de promessas fáceis, pressa e pedidos de Pix para pessoas físicas.\n\nExercício: abra a aba Truques, leia os sinais de golpe e escreva 3 deles.`,null]];

Gen.bases={runner:"<!DOCTYPE html><html lang=\"pt-BR\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover\"><title>Neon Runner<\/title><style>\nhtml,body{margin:0;height:100%;overflow:hidden;background:#05070f;font-family:system-ui,-apple-system,sans-serif;color:#e8ecff;touch-action:manipulation;-webkit-user-select:none;user-select:none}\ncanvas{position:fixed;left:0;top:0;width:100%;height:100%}\n#hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:calc(12px + env(safe-area-inset-top,0px)) 16px;font:800 20px system-ui;text-shadow:0 2px 8px #000;pointer-events:none}\n#ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(5,7,15,.72);text-align:center;padding:20px}\nh1{font:900 44px system-ui;margin:0;letter-spacing:.08em;background:linear-gradient(120deg,#3b82f6,#8b5cf6,#22d3ee);-webkit-background-clip:text;background-clip:text;color:transparent}\np{color:#9fb0ff;margin:10px 0 20px;max-width:320px}button{border:0;border-radius:14px;padding:14px 38px;font:800 17px system-ui;color:#fff;background:linear-gradient(120deg,#3b82f6,#8b5cf6 55%,#22d3ee);box-shadow:0 8px 30px rgba(99,102,241,.45)}\n<\/style><\/head><body><canvas id=\"c\"><\/canvas><div id=\"hud\"><span id=\"sc\">0<\/span><span id=\"bs\">Recorde 0<\/span><\/div>\n<div id=\"ov\"><h1 id=\"t\">NEON RUNNER<\/h1><p id=\"m\">Toque na tela ou aperte espaço para pular. Pule duas vezes no ar e pegue as moedas!<\/p><button id=\"go\">JOGAR<\/button><\/div>\n<script>\n(()=>{const cv=document.getElementById('c'),cx=cv.getContext('2d'),$=id=>document.getElementById(id);let W=2,H=2,K=1;\nconst size=()=>{K=Math.min(devicePixelRatio||1,2);W=cv.width=innerWidth*K|0;H=cv.height=innerHeight*K|0};size();addEventListener('resize',size);\nlet st='menu',sp=0,score=0,best=0,py=0,vy=0,jm=0,obs=[],coins=[],parts=[],shake=0,nx=1,bg=0,tm=0,got=0;const stars=Array.from({length:70},()=>[Math.random(),Math.random()*.6,Math.random()*2+.5]);\ntry{best=+localStorage.getItem('nr_best')||0}catch(e){}$('bs').textContent='Recorde '+best;\nconst gy=()=>H*.78,PX=()=>W*.22,U=()=>Math.min(W,H*.9)*.1;let ac;\nconst beep=(f,d,v,ty)=>{try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=ty||'square';o.frequency.value=f;g.gain.value=v||.05;o.connect(g);g.connect(ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);o.stop(ac.currentTime+d)}catch(e){}};\nconst burst=(x,y,n,c,s)=>{for(let i=0;i<n;i++)parts.push({x,y,vx:(Math.random()-.5)*s,vy:(Math.random()-.8)*s,l:.5+Math.random()*.4,c})};\nfunction reset(){sp=H*.72;score=0;py=0;vy=0;jm=0;obs=[];coins=[];parts=[];shake=0;nx=1.1;tm=0;got=0}\nfunction jump(){if(st!=='run')return;if(jm<2){vy=H*(jm?1.0:1.2);jm++;beep(jm>1?620:440,.12,.06);burst(PX(),gy()-py,8,'34,211,238',H*.4)}}\nfunction over(){st='over';shake=.6;beep(120,.5,.12,'sawtooth');burst(PX(),gy()-py-U()/2,40,'236,72,153',H*.9);const s=Math.floor(score);let nb=false;if(s>best){best=s;nb=true;try{localStorage.setItem('nr_best',s)}catch(e){}}\n $('bs').textContent='Recorde '+best;$('t').textContent=nb?'NOVO RECORDE!':'FIM DE JOGO';$('m').textContent=s+' pontos · '+got+' moedas';$('go').textContent='JOGAR DE NOVO';$('ov').style.display='flex'}\nfunction begin(){reset();st='run';$('ov').style.display='none'}\n$('go').onclick=e=>{e.stopPropagation();begin()};addEventListener('pointerdown',e=>{if(st==='run')jump()});addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();if(st==='run')jump();else if(st!=='run'&&$('ov').style.display!=='none')begin()}});\nfunction update(dt){bg+=(st==='run'?sp:H*.25)*dt;shake*=Math.pow(.01,dt);for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.l-=dt;if(p.l<=0){parts.splice(i,1);continue}p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=H*1.6*dt}\n if(st!=='run')retur DATA.lessons['Marketing Digital: Primeiros Passos'].push(['Constância nas redes sociais',`Poucos posts bons e constantes vencem muitos posts de vez em quando. Escolha uma frequência que você consegue manter e um horário fixo para criar o conteúdo.\n\nExercício: monte um calendário de 7 dias com um tema por dia.`,null],['Medindo resultados',`O que não é medido não melhora. Olhe alcance (quantos viram), engajamento (quantos interagiram) e conversão (quantos fizeram o que você queria, como chamar no WhatsApp).\n\nExercício: defina uma meta de conversão para a próxima semana.`,null]);
DATA.lessons['Do Zero à Primeira Venda'].push(['Preço e custos',`Some todos os custos: produto, tempo, taxas e entrega. O preço precisa cobrir isso e deixar lucro. Não cobre barato demais só para vender: depois fica difícil subir.\n\nExercício: calcule o custo e o preço de venda de um produto seu.`,null],['Atendimento e fidelização',`Cliente bem atendido volta e indica. Responda rápido, seja claro sobre prazos e peça opinião depois da compra. Vender de novo para quem já comprou custa menos do que achar um cliente novo.\n\nExercício: escreva a mensagem que você manda depois de uma venda.`,null]);
DATA.lessons['Investimentos para Iniciantes'].push(['Imposto e custos',`Todo investimento pode ter custos (taxas, corretagem) e imposto sobre o ganho. As regras mudam com o tempo, então compare sempre o rendimento líquido e confira a regra atual na corretora ou na Receita Federal.\n\nExercício: escolha 2 investimentos e liste que custos cada um pode ter.`,null],['Montando uma carteira simples',`Carteira é o conjunto dos seus investimentos. A ideia didática é separar o dinheiro por objetivo e prazo: reserva em algo seguro, e só depois o que pode oscilar. Isso é um exemplo de estudo, não uma recomendação para você.\n\nExercício: escreva seus 3 objetivos e o prazo de cada um.`,null]);
DATA.lessons['Tráfego Pago na Prática']=[['O que é tráfego pago',`Tráfego pago é pagar para a plataforma mostrar seu anúncio para pessoas. Você escolhe quem vê e quanto gasta. Diferente do orgânico, o resultado aparece mais rápido, mas para quando você para de pagar.\n\nExercício: escreva qual ação você quer que a pessoa faça ao ver o anúncio.`,null],['Público e orçamento',`Comece com um público específico (idade, interesse, região) e um orçamento pequeno por dia. Público muito amplo gasta dinheiro à toa. Só aumente o valor depois de ver resultado.\n\nExercício: descreva seu público ideal em 3 linhas.`,null],['Criativo, teste e métricas',`Teste 2 versões do anúncio (imagem e texto) e compare. Olhe o custo por clique e o custo por resultado. Pause o que não funciona e mantenha o que funciona.\n\nExercício: escreva duas versões do texto de um anúncio.`,null]];
DATA.lessons['Criando Agentes de IA']=[['O que é um agente de IA',`Um agente é uma IA com um papel claro, instruções e, às vezes, ferramentas para agir. Em vez de um chat solto, ele tem uma função, como atender clientes ou resumir textos.\n\nExercício: descreva um agente que ajudaria no seu dia a dia, em uma frase.`,null],['Instruções e ferramentas',`Boas instruções dizem o papel, o tom, o que fazer e o que não fazer. Ferramentas são ações extras, como buscar informações. Quanto mais clara a instrução, mais confiável o agente.\n\nExercício: escreva as instruções do seu agente com papel, tom e limites.`,null],['Testando e melhorando',`Teste o agente com perguntas fáceis, difíceis e armadilhas. Anote onde ele errou e ajuste a instrução. Agentes bons são feitos de muitos testes pequenos.\n\nExercício: crie 5 perguntas de teste para o seu agente.`,null]];
